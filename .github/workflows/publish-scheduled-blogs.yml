name: Publish Scheduled Blogs

on:
  schedule:
    # Runs every 3 hours, every day. The publish script itself only
    # acts on posts whose publish-date has arrived (and skips/cleans
    # up anything already live), so frequent checks are safe and
    # simply protect against GitHub occasionally skipping a run.
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run publish script
        run: python scripts/publish_scheduled_blogs.py

      - name: Commit and push published blogs
        run: |
          git config user.name  "BC Team Bot"
          git config user.email "bot@bcteam1.com"
          git add pages/blog/ pages/blog.html assets/blog/ pages/scheduled/ assets/scheduled/
          git diff --cached --quiet || git commit -m "chore: publish scheduled blog(s) [$(date +%Y-%m-%d)]"
          git push
