name: Publish Scheduled Blogs

on:
  schedule:
    # Posts go live at 9:00 AM Eastern Time (EST/EDT). 9 AM Eastern is
    # 13:00 UTC in summer (EDT) and 14:00 UTC in winter (EST). Runs
    # cover 13:00-17:00 UTC hourly so a delayed GitHub run still
    # publishes the same morning; the script itself refuses to publish
    # before 9:00 AM Eastern, so early runs are harmless no-ops.
    - cron: '0 13-17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run publish script
        run: python scripts/publish_scheduled_blogs.py

      - name: Commit and push published blogs
        run: |
          git config user.name  "BC Team Bot"
          git config user.email "bot@bcteam1.com"
          git add pages/blog/ pages/blog.html assets/blog/ pages/scheduled/ assets/scheduled/
          git diff --cached --quiet || git commit -m "chore: publish scheduled blog(s) [$(date +%Y-%m-%d)]"
          git push
